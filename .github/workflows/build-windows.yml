name: Build Windows release

# Builds the PyInstaller executables on every tag (v*) and attaches
# them to the matching GitHub release. Also runnable manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build
        run: pyinstaller --noconfirm build_windows.spec

      - name: Rename with version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq "") { $ver = "dev" }
          Move-Item dist/TranslationAggregator.exe "dist/TranslationAggregator-$ver-win64.exe"
          Move-Item dist/transagg.exe "dist/transagg-$ver-win64.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.exe --clobber
