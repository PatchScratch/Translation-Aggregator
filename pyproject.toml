[project]
name = "translation-aggregator"
version = "0.2.0"
description = "Cross-platform Python port of Translation Aggregator (web translators + JParser + MeCab + ATLAS via Wine)"
readme = "README_PYTHON.md"
requires-python = ">=3.9"
license = {text = "GPL-2.0-or-later"}

dependencies = [
    "requests>=2.28",
    "httpx>=0.24",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5",
    "PyQt6-Qt6>=6.5; platform_system != 'Darwin'",
]
mecab = [
    "mecab-python3>=1.0.0",
    "unidic-lite; platform_system == 'Windows'",
]
browser = [
    "playwright>=1.44",
]
full = [
    "translation-aggregator[gui,mecab,browser]",
]

[project.scripts]
transagg = "translation_aggregator.cli:main"
transagg-gui = "translation_aggregator.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translation_aggregator"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
